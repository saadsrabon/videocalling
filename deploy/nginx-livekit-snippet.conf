# Add to admin.simfree.io nginx server block (/etc/nginx/sites-available/simfree)
# LiveKit signaling proxied to video server; WebRTC media still goes direct to 147.79.71.98

upstream livekit_signal {
    server 147.79.71.98:7880;
    keepalive 8;
}

