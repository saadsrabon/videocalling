# Example coturn config — copy to /etc/turnserver.conf on your VPS

listening-port=3478
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=YOUR_TURN_SECRET
realm=videocalling.local

external-ip=YOUR_VPS_PUBLIC_IP

min-port=49152
max-port=65535

total-quota=100
stale-nonce
no-loopback-peers
no-multicast-peers

log-file=/var/log/turnserver.log
simple-log
