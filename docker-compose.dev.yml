# Local SFU testing with Docker Desktop (Windows/macOS).
# Browsers on the host use localhost:3004; mediasoup ICE uses host.docker.internal.
services:
  videocalling:
    build: .
    ports:
      - "3004:3004"
      - "40000:40000/udp"
      - "40000:40000/tcp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      NODE_ENV: development
      MEDIASOUP_ANNOUNCED_IP: host.docker.internal
      MEETING_BASE_URL: http://localhost:3002/meet
